[supervisord]
nodaemon=true
user=root

[program:xorg]
command=/usr/bin/X :0 -seat seat0 -auth /tmp/serverauth.0 -nolisten tcp vt1 -novtswitch
autostart=true
autorestart=true
priority=100
user=root
stdout_logfile=/var/log/xorg.log
stderr_logfile=/var/log/xorg.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -nopw -listen 0.0.0.0 -xkb -forever -shared
autostart=true
autorestart=true
priority=200
depends_on=xorg
stdout_logfile=/var/log/vnc.log
stderr_logfile=/var/log/vnc.log

[program:desktop]
command=/usr/local/bin/configure-desktop.sh
autostart=true
autorestart=true
priority=300
depends_on=xorg
environment=DISPLAY=":0"

